<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tender comparison — RYE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --rye-display: 'Slussen Display', 'Geist', ui-sans-serif, system-ui, sans-serif;
  --rye-sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
  --rye-mono: 'Geist Mono', ui-monospace, monospace;
  --rye-green: #0cce6b;
  --rye-amber: #f5a623;
  --rye-red: #ee0000;
  --rye-blue: #0070f3;
  --rye-purple: #7928ca;
  --rye-green-fill: rgba(12, 206, 107, 0.85);
  --rye-green-soft: rgba(12, 206, 107, 0.35);
  --rye-green-faint: rgba(12, 206, 107, 0.12);
  --rye-amber-fill: rgba(245, 166, 35, 0.85);
  --rye-amber-soft: rgba(245, 166, 35, 0.35);
  --rye-amber-faint: rgba(245, 166, 35, 0.10);
  --rye-orange: #F96A2E; /* RYE brand orange */
  --bg: #000000; --surface: #0a0a0a; --surface-raised: #141414;
  --border: #1f1f1f; --border-strong: #2e2e2e;
  --t1: #ededed; --t2: #a1a1a1; --t3: #7a7a7a; --t4: #4a4a4a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: dark; }
body {
  background: var(--bg);
  background-image: radial-gradient(circle, #111 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--t1);
  font-family: var(--rye-sans);
  font-size: 13px; letter-spacing: -0.005em; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: #000; }
::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 5px; border: 2px solid #000; }
::-webkit-scrollbar-thumb:hover { background: #2a2a2a; }
::selection { background: rgba(255,255,255,.18); }

/* ---- Nav ---- */
nav {
  height: 52px; border-bottom: 1px solid var(--border); background: #000;
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 10px; padding: 0 20px;
}
.logo { width: 22px; height: 22px; border-radius: 5px; background: var(--rye-orange); color: #fff;
  font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; }
.brand { font-size: 15px; font-weight: 600; letter-spacing: -0.015em; }
.nav-right { margin-left: auto; font-family: var(--rye-mono); font-size: 11px; color: var(--t3); }

/* ---- Layout ---- */
main { max-width: 1080px; margin: 0 auto; padding: 28px 20px 60px; }
section { margin-top: 28px; }
.section-label { font-family: var(--rye-mono); font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.05em; color: var(--t3); margin-bottom: 12px; }
h1 { font-family: var(--rye-display); font-size: 44px; font-weight: 500;
  letter-spacing: -0.03em; line-height: 1.05; text-wrap: balance; }
.subtitle { color: var(--t2); font-size: 13px; margin-top: 8px; }
.subtitle .mono { font-family: var(--rye-mono); font-size: 11px; color: var(--t3); }

/* ---- Cards / KPI ---- */
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 18px 20px; transition: border-color 120ms; }
.card:hover { border-color: var(--border-strong); }
.card.accent-green { border-left: 2px solid var(--rye-green); }
.card.accent-amber { border-left: 2px solid var(--rye-amber); }
.card.accent-blue { border-left: 2px solid var(--rye-blue); }
.card.accent-purple { border-left: 2px solid var(--rye-purple); }
.kpi-label { font-family: var(--rye-mono); font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.05em; color: var(--t3); }
.kpi-value { font-size: 30px; font-weight: 600; letter-spacing: -0.035em; line-height: 1;
  margin-top: 10px; font-variant-numeric: tabular-nums; }
.kpi-sub { font-family: var(--rye-mono); font-size: 11px; color: var(--t3); margin-top: 8px; }
.pos { color: var(--rye-green); } .neg { color: var(--rye-red); } .warn { color: var(--rye-amber); }

/* ---- Chips ---- */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px;
  border-radius: 4px; font-family: var(--rye-mono); font-size: 11px; font-weight: 500; }
.chip.neutral { background: var(--surface-raised); color: var(--t2); border: 1px solid var(--border); }
.chip.success { color: var(--rye-green); border: 1px solid var(--rye-green-soft); }
.chip.warning { color: var(--rye-amber); border: 1px solid var(--rye-amber-soft); }
.chip.danger  { color: var(--rye-red); border: 1px solid rgba(238,0,0,.35); }
.chip.info    { color: var(--rye-blue); border: 1px solid rgba(0,112,243,.35); }

/* ---- Bar chart ---- */
.bars { display: flex; flex-direction: column; gap: 12px; }
.bar-gas { opacity: 0.4; box-shadow: inset 1px 0 0 var(--surface); }
.bar-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 16px;
  padding-top: 14px; border-top: 1px solid var(--border); }
.bar-gas-sw { opacity: 0.4; }
.bar-row { display: grid; grid-template-columns: 220px 1fr 110px; gap: 12px; align-items: center; }
.bar-name { font-size: 13px; color: var(--t1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-name .term { font-family: var(--rye-mono); font-size: 11px; color: var(--t3); margin-left: 6px; }
.bar-track { height: 22px; position: relative; }
.bar-fill { position: absolute; inset: 0 auto 0 0; border-radius: 1px;
  transform-origin: left; animation: growBarH 600ms ease-out both; }
/* NB: the gas segment's inline animation-delay adds this 600ms so it grows out of
   the electricity segment's end — keep the two in step if the duration changes. */
.bar-val { font-family: var(--rye-mono); font-size: 11px; font-weight: 500;
  letter-spacing: -0.02em; text-align: right; font-variant-numeric: tabular-nums; }
@keyframes growBarH { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes growBar  { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

/* ---- Tables ---- */
.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { font-family: var(--rye-mono); font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--t3); text-align: right; padding: 10px 14px;
  border-bottom: 1px solid var(--border); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td { padding: 9px 14px; font-family: var(--rye-mono); font-size: 11px; font-weight: 500;
  letter-spacing: -0.02em; color: var(--t2); text-align: right;
  font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--border); white-space: nowrap; }
tr:last-child td { border-bottom: none; }
td.name { font-family: var(--rye-sans); font-size: 13px; color: var(--t1); }
td .sub { display: block; font-size: 10px; color: var(--t4); font-weight: 400; }
/* Unit under a rate-book column label. A second line rather than a longer header:
   appending the unit inline pushed the widest rate books into horizontal scroll at
   1280px, where they had fitted before. */
th .unit { display: block; font-size: 9px; color: var(--t4); font-weight: 400;
  letter-spacing: 0.04em; text-transform: none; margin-top: 2px; }
tr:hover td { background: rgba(255,255,255,0.015); }
td.best { color: var(--rye-green); }
td.total { color: var(--t1); }
.total-row td { border-top: 1px solid var(--border-strong); font-weight: 500; color: var(--t1); }
tr.incumbent-row td { color: var(--t3); }
tr.incumbent-row td.name { color: var(--t2); }

/* Effective-rate pair (incumbent / offered) + inline deltas — site-by-site table */
.effrate .cur { color: var(--t3); }
.effrate .sep { color: var(--t4); margin: 0 3px; }
.effrate .off { color: var(--t1); }
.effrate .off.better { color: var(--rye-green); }
.cell-delta { font-size: 10px; color: var(--t3); margin-left: 5px; font-variant-numeric: tabular-nums; }
.cell-delta.save { color: var(--rye-green); }
.cell-delta.rise { color: var(--rye-red); }
td.diff.save { color: var(--rye-green); }
td.diff.rise { color: var(--rye-red); }
.est { color: var(--t4); font-size: 9px; vertical-align: super; margin-left: 1px; }
.est-note { font-family: var(--rye-mono); font-size: 10px; color: var(--t4); margin-top: 10px; padding-left: 2px; }

/* ---- Details / rate books ---- */
details { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; }
details[open] { border-color: var(--border-strong); }
summary { cursor: pointer; padding: 14px 20px; font-size: 14px; font-weight: 500;
  letter-spacing: -0.011em; display: flex; align-items: center; gap: 10px; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary .caret { color: var(--t3); font-family: var(--rye-mono); font-size: 10px; transition: transform 120ms; }
details[open] summary .caret { transform: rotate(90deg); }
details .table-wrap { border: none; border-top: 1px solid var(--border); border-radius: 0 0 8px 8px; }

/* ---- Fee control ---- */
.fee-controls { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 14px; }
.fee-controls input[type=range] { -webkit-appearance: none; appearance: none; width: 100%;
  height: 4px; background: var(--surface-raised); border-radius: 2px; outline: none; cursor: pointer; }
.fee-controls input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px;
  height: 14px; border-radius: 50%; background: var(--rye-green); border: 2px solid #000; cursor: pointer; }
.fee-controls input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%;
  background: var(--rye-green); border: 2px solid #000; cursor: pointer; }
.fee-controls input[type=number] { width: 80px; height: 28px; padding: 0 8px; background: #000;
  border: 1px solid var(--border); border-radius: 6px; color: var(--t1);
  font-family: var(--rye-mono); font-size: 12px; color-scheme: dark; }
.fee-controls input[type=number]:focus { border-color: var(--border-strong); outline: none; }
@media print { .fee-controls { display: none; } }

/* ---- Notices / footer ---- */
.notice { border: 1px solid var(--rye-amber-soft); background: var(--rye-amber-faint);
  border-radius: 8px; padding: 12px 16px; font-size: 12px; color: var(--t2); margin-bottom: 14px; }
.notice .chip { margin-right: 8px; }
footer { margin-top: 40px; border-top: 1px solid var(--border); padding-top: 20px; }
.assumptions li { font-family: var(--rye-mono); font-size: 11px; color: var(--t3);
  line-height: 1.6; list-style: none; padding-left: 14px; position: relative; }
.assumptions li::before { content: "—"; position: absolute; left: 0; color: var(--t4); }
.prepared { margin-top: 20px; font-family: var(--rye-mono); font-size: 11px; color: var(--t4); }

@media (max-width: 720px) {
  h1 { font-size: 32px; }
  .bar-row { grid-template-columns: 130px 1fr 90px; }
  .rec-grid { grid-template-columns: 1fr !important; }
}
@media print {
  body { background-image: none; }
  nav { position: static; }
}

/* Offer filter (design-system tab bar) */
.offer-filter-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.offer-filter { display: inline-flex; height: 28px; padding: 2px; background: #000; border: 1px solid var(--border); border-radius: 6px; gap: 2px; flex: 0 0 auto; }
.offer-filter button { font-family: var(--rye-mono); font-size: 11px; font-weight: 500; letter-spacing: -0.005em; color: var(--t3); background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 0 10px; cursor: pointer; transition: all 80ms; }
.offer-filter button:hover { color: var(--t1); }
.offer-filter button.on { background: var(--surface-raised); border: 1px solid var(--border); color: var(--t1); }
@media print { .offer-filter { display: none !important; } }

/* ---- Main tab bar ---- */
.tabbar { display: inline-flex; height: 32px; padding: 2px; background: #000;
  border: 1px solid var(--border); border-radius: 6px; gap: 2px; margin: 24px 0 4px; }
.tab { display: inline-flex; align-items: center; padding: 0 15px; font-family: var(--rye-mono);
  font-size: 11.5px; font-weight: 500; letter-spacing: -0.005em; color: var(--t3);
  border: 1px solid transparent; border-radius: 4px; cursor: pointer; transition: all 80ms; user-select: none; }
.tab:hover { color: var(--t1); }
.tab.active { background: var(--surface-raised); border-color: var(--border); color: var(--t1); }
.tabpane[hidden] { display: none; }
@media print { .tabbar { display: none; } .tabpane[hidden] { display: block !important; } }

/* ---- Market context ---- */
.chartcard { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
.split2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 820px) { .split2 { grid-template-columns: 1fr; } }
.mchart { width: 100%; height: auto; display: block; }
.axlabel { font-family: var(--rye-mono); font-size: 10px; fill: var(--t3); }
.gridln { stroke: var(--border); stroke-dasharray: 2 3; }
.mk { font-family: var(--rye-mono); font-size: 11px; font-weight: 500; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px; }
.lg { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--t2); }
.sw { width: 11px; height: 11px; border-radius: 2px; flex: none; }
.gcard { background: var(--surface-raised); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; }
.takeaway-card { border-left: 2px solid var(--rye-green); }
</style>
</head>
<body>

<nav>
  <div class="logo">R</div>
  <div class="brand">RYE</div>
  <div class="nav-right" id="nav-meta"></div>
</nav>

<main id="app"></main>

<script>
const RAW = __TENDER_DATA__;
const MULTI = !!RAW.multiFuel;
/* A combined gas+electricity tender arrives as {multiFuel, fuels:[...]}, one full
   single-fuel payload per fuel. Overlay the shared header + market, and null the
   per-fuel fee (RYE's flat fee is applied ONCE at tender level, shown by the strip
   above the toggle). A single-fuel tender is just [RAW], so nothing else changes. */
const FUELS = MULTI
  ? RAW.fuels.map(f => Object.assign({}, f, {
      client: RAW.client, label: RAW.label, generated: RAW.generated,
      market: RAW.market, fee: null, commission: null }))
  : [RAW];
let activeFuel = 0;
const primaryIndex = RAW.primaryIndex || 0;
let activePortfolioFuel = primaryIndex;
/* Module state for the ACTIVE fuel view, (re)assigned by setState() on every render. */
let TENDER, allOffers, rec, fee, commission, inc, savings, baseline,
    isBenchmark, baseLabel, baseLc, baseChip, totalEac, comps, hasInc, hasMarket,
    timeline, hasTimeline;

const gbp = v => (v < 0 ? "−£" : "£") + Math.round(Math.abs(v)).toLocaleString("en-GB");
const gbpSigned = v => (v > 0 ? "+" : v < 0 ? "−" : "") + "£" + Math.round(Math.abs(v)).toLocaleString("en-GB");
const num = v => v == null ? "—" : Number(v).toLocaleString("en-GB", { maximumFractionDigits: 3 });
const gbp2 = v => "£" + Number(v || 0).toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
/* ---- Flat fee: charged supply points vs the portfolio ----------------------
   RYE can charge the fee on FEWER supply points than the tender covers (e.g. 10
   of 14) rather than back-solving an equivalent portfolio discount. The client is
   never shown the count: they see the rate per supply point and the portfolio
   discount it works out at. With no cap, charged == total and every figure below
   is identical to the old behaviour. */
const feeTotalPts = f => (f && f.totalSites) || ((typeof TENDER !== "undefined" && TENDER) ? TENDER.sites.length : 0) || 1;
const feeChargedPts = f => (f && f.chargeableSites != null) ? f.chargeableSites : feeTotalPts(f);
/* Slider position = discount off list on the CHARGED rate, so dragging it moves
   the rate itself. The portfolio discount is a read-out, not the control. */
const feeSliderPct = f => {
  const list = (f && f.listPerSiteMonth) || 90;
  return list ? Math.round((1 - ((f && f.perSiteMonth) || 0) / list) * 100) : 0;
};
function feeRateNote(f, psm) {
  const list = (f && f.listPerSiteMonth) || 90;
  const total = feeTotalPts(f), charged = feeChargedPts(f);
  const annual = Math.max(0, psm || 0) * charged * 12;
  const blended = total ? annual / (12 * total) : 0;
  const disc = list ? Math.round((1 - blended / list) * 100) : 0;
  if (charged < total) return `${disc}% portfolio discount · equivalent to ${gbp2(blended)} per supply`;
  return disc > 0 ? `${disc}% off list £${list}/supply point/month` : `list price £${list}/supply point/month`;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
/* Portfolio size for the title byline: GWh for large portfolios, MWh for most,
   kWh for a single small meter. Annual consumption, so the unit is always /yr. */
const eacHeadline = kwh =>
  kwh >= 1e6 ? (kwh / 1e6).toFixed(2) + " GWh"
    : kwh >= 1e3 ? Math.round(kwh / 1e3).toLocaleString("en-GB") + " MWh"
      : Math.round(kwh).toLocaleString("en-GB") + " kWh";
/* Contract dates render as "1 Aug 2026". ISO in → friendly out; a non-ISO string
   is shown as-is (escaped); empty → em dash. */
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fmtDate = iso => {
  if (!iso) return "—";
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso));
  return m ? `${+m[3]} ${MONTHS[+m[2] - 1]} ${m[1]}` : esc(iso);
};

function setState(view) {
  TENDER = view;
  allOffers = (TENDER.incumbent ? [TENDER.incumbent] : []).concat(TENDER.offers);
  rec = TENDER.offers.find(o => o.id === (TENDER.recommendedId || TENDER.bestId)) || TENDER.offers[0];
  fee = TENDER.fee;
  commission = TENDER.commission;
  inc = TENDER.incumbent;
  savings = inc ? inc.total - rec.total : null;
  baseline = TENDER.baseline || { kind: "incumbent" };
  isBenchmark = baseline.kind === "benchmark";
  baseLabel = isBenchmark ? "Market benchmark" : "Incumbent";
  baseLc = baseLabel.toLowerCase();
  baseChip = isBenchmark ? "benchmark" : "incumbent";
  totalEac = TENDER.sites.reduce((a, s) => a + (s.eac || 0), 0);
  comps = TENDER.components;
  hasInc = !!inc;
  hasMarket = !!(TENDER.market && (TENDER.market.power || TENDER.market.gas));
  timeline = TENDER.timeline || null;
  hasTimeline = !!(timeline && timeline.months && timeline.months.length);
}

document.title = `${RAW.client} \u2014 ${RAW.label} \u2014 RYE`;
document.getElementById("nav-meta").textContent =
  `${RAW.client} \u00b7 prepared ${RAW.generated}`;

const CHART = { red: "#ee0000", amber: "#f5a623", green: "#0cce6b", blue: "#0070f3", purple: "#7928ca", t1: "#ededed" };

/* ================= section builders ================= */

function buildHero() {
  return `<header>
    <div class="section-label">${esc(TENDER.utility || "energy")} tender · ${TENDER.offers.length} offers · ${TENDER.sites.length} supply point${TENDER.sites.length === 1 ? "" : "s"}</div>
    <h1>${esc(TENDER.label)}</h1>
    <div class="subtitle">Prepared for ${esc(TENDER.client)} by RYE.
      <span class="mono">${totalEac > 0 ? `${eacHeadline(totalEac)} tender. ` : ""}Standardised annual costs — like-for-like across all offers.</span></div>
  </header>`;
}

function buildWarnings() {
  if (!TENDER.globalWarnings.length) return "";
  return `<section>` + TENDER.globalWarnings.map(w =>
    `<div class="notice"><span class="chip warning">note</span>${esc(w)}</div>`).join("") + `</section>`;
}

/* NB: the header KPI rows (total consumption / blended unit rate / estimated
   spend, and their fee and portfolio variants) were removed deliberately — every
   figure they carried is in the standardised comparison table below, and the
   portfolio size now sits in the title byline. Don't reinstate them. */

/* ---- Summary: benchmark disclosure ----
   Sits ABOVE the recommendation so the client reads what the saving is measured
   against before they read the number itself. Doubles as the ask: the fastest way
   to turn an indicative saving into a real one is for them to send their rates. */
function buildBenchmarkNotice() {
  if (!isBenchmark) return "";
  return `<section><div class="notice">
    <span class="chip warning">benchmark</span>
    <b>Benchmarked, not billed.</b> We don't hold your current rates, so the figures below compare
    our offers against UK market average costs — indicative only, not your actual contract.
    Send us your latest bill or contract and we'll rebuild this against what you're really paying.
  </div></section>`;
}

/* ---- Summary: recommendation vs baseline ---- */
function buildRecVsInc() {
  const pk = (v, cls) => `<td class="${cls || ""}">${v == null ? "—" : Number(v).toFixed(2)}</td>`;
  const perSite = TENDER.sites.length || 1;
  // The comparison already lists the offer's quoted effective rate; the extra
  // commission row reveals the "other" rate (the one the quote doesn't state).
  const cOther = commission ? (commission.included ? commission.rateExclCommission : commission.rateInclCommission) : null;
  const cOtherLabel = commission && commission.included ? "excl." : "incl.";
  return `<section>
    <div class="section-label">Our recommendation — ${esc(rec.supplier)} · ${esc(rec.term)}</div>
    <div style="display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:14px" class="rec-grid">
      <div class="card accent-green">
        <span class="chip success">recommended</span>
        <div style="font-size:22px;font-weight:600;letter-spacing:-0.02em;margin-top:12px">${esc(rec.supplier)}</div>
        <div class="kpi-sub">${esc(rec.term)} fixed · covers all ${TENDER.sites.length} supply point${TENDER.sites.length === 1 ? "" : "s"}</div>

        <div class="kpi-sub">RYE commission ${commission.pKwhUplift} p/kWh · ${gbp(commission.annual)}/yr</div>`) : ""}
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Standardised comparison</th>
          <th>${baseLabel}</th>

/* ---- Cost comparison bars ---- */
/* opts: {title, idSuffix, sectionClass, hidden}. A combined tender renders one
   block per fuel on the Summary, so ids must be unique and the gas block starts

function buildBars(opts) {
  const o_ = opts || {};
  const maxTotal = Math.max(...allOffers.map(o => o.total));
  const CAT_LABELS = { coterminous: "Coterminous", fixed: "Fixed length" };
  const catLabel = c => CAT_LABELS[c] || (c.charAt(0).toUpperCase() + c.slice(1));
  const offerCats = [...new Set(allOffers.filter(o => !o.isIncumbent && o.category).map(o => o.category))];
  const showOfferFilter = offerCats.length >= 2;
  return `<section class="${esc(o_.sectionClass || "")}"${o_.hidden ? " hidden" : ""}>
    <div class="offer-filter-row">
      <div class="section-label">${esc(o_.title || "All offers tendered — estimated annual cost")}</div>
      ${showOfferFilter ? `<div class="offer-filter" id="offer-filter${esc(o_.idSuffix || "")}"><button data-f="all" class="on">All</button>${offerCats.map(c => `<button data-f="${esc(c)}">${esc(catLabel(c))}</button>`).join("")}</div>` : ""}
    </div>
    <div class="card"><div class="bars">` +
    allOffers.slice().sort((a, b) => a.total - b.total).map((o, i) => {
      const fill = o.isIncumbent ? "var(--rye-amber-fill)"
        : o.id === rec.id ? "var(--rye-green-fill)" : "rgba(237,237,237,0.7)";
      const chip = o.isIncumbent ? `<span class="chip warning">${baseChip}</span>`
        : o.id === rec.id ? `<span class="chip success">recommended</span>` : "";
      return `<div class="bar-row" data-cat="${esc(o.category || 'other')}">
        <div class="bar-name">${esc(o.supplier)}${o.isIncumbent && isBenchmark ? "" : `<span class="term">${esc(o.term)}</span>`}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(o.total / maxTotal * 100).toFixed(1)}%;background:${fill};animation-delay:${i * 60}ms"></div></div>
        <div class="bar-val">${gbp(o.total)} ${chip}</div>
      </div>`;
    }).join("") + `</div></div></section>`;
}

/* ---- Site-by-site matrix ---- */
function buildSiteMatrix() {
  if (TENDER.sites.length <= 1) return "";
  const byId = {};
  allOffers.forEach(o => { byId[o.id] = {}; o.sites.forEach(s => byId[o.id][s.mpxn] = s); });
  // One quote is the norm going forward: with a single offer we show a dedicated
  // +/- column vs the baseline. With >1 offer that column is ambiguous, so each
  // offer cell instead carries a small inline delta vs the baseline (the
  // "£1,240 (−£380)" pattern from the finance reports).
  const singleOffer = TENDER.offers.length === 1;
  // Efficiency = each meter's all-in effective rate (£/yr ÷ EAC × 100), i.e. the
  // p/kWh that meter is actually running at once every charge is standardised.
  // Shown as an "incumbent / offered" pair. The offered side ALWAYS uses the BEST
  // (cheapest) quote, so with several offers on the page the column still reads
  // against one clear number rather than an ambiguous average — the header says so.
  const bestOffer = allOffers.find(o => !o.isIncumbent && o.id === TENDER.bestId)
    || allOffers.find(o => !o.isIncumbent) || rec;
  const recMixed = new Set(rec.sites.map(s => s.supplier || rec.supplier)).size > 1;
  const eff = (cell, eac) => (cell && eac) ? (cell.total / eac * 100) : null;
  const p1 = v => v == null ? "—" : v.toFixed(1) + "p";
  const offeredLbl = singleOffer ? "offered" : "best";
  return `<section>
    <div class="section-label">Supply-by-supply annual cost (£/year)</div>
    <div class="table-wrap"><table>
      <thead><tr><th>Supply</th><th>EAC kWh</th>` +
      `<th>Efficiency<br>${inc ? baseLc + " / " + offeredLbl : offeredLbl}</th>` +
      allOffers.map(o => `<th>${o.isIncumbent ? baseLabel : esc(o.supplier) + "<br>" + esc(o.term)}</th>`).join("") +
      (singleOffer && inc ? `<th>${isBenchmark ? "Indicative " : ""}Δ vs ${baseLc}</th>` : "") +
      `</tr></thead><tbody>` +
    TENDER.sites.map(site => {
      const cells = allOffers.map(o => byId[o.id][site.mpxn]);
      const min = Math.min(...cells.map((c, i) => (c && !allOffers[i].isIncumbent) ? c.total : Infinity));
      const incCell = inc ? byId[inc.id][site.mpxn] : null;
      const recCell = byId[rec.id][site.mpxn];
      const bestCell = byId[bestOffer.id][site.mpxn];
      const effInc = eff(incCell, site.eac), effBest = eff(bestCell, site.eac);
      const effHtml = `<td class="effrate">` +
        (inc ? `<span class="cur">${p1(effInc)}</span><span class="sep">/</span>` : "") +
        `<span class="off ${(effInc != null && effBest != null && effBest <= effInc) ? "better" : ""}">${p1(effBest)}</span></td>`;
      const costCells = cells.map((c, i) => {
        if (!c) return `<td>—</td>`;
        const isInc = allOffers[i].isIncumbent;
        const best = !isInc && c.total === min ? "best" : "";
        let deltaHtml = "";
        if (!singleOffer && inc && !isInc && incCell) {
          const d = c.total - incCell.total; // negative = cheaper than baseline
          deltaHtml = `<span class="cell-delta ${d <= 0 ? "save" : "rise"}">(${gbpSigned(d)})</span>`;
        }
        return `<td class="${best}">${gbp(c.total)}${deltaHtml}</td>`;
      });
      let diffHtml = "";
      if (singleOffer && inc && incCell && recCell) {
        const save = incCell.total - recCell.total; // positive = saving on this site
        diffHtml = `<td class="diff ${save >= 0 ? "save" : "rise"}">${gbpSigned(save)}</td>`;
      }
      return `<tr><td class="name">${esc(site.name)}<span class="sub">${esc(site.mpxn)}</span>${recMixed && recCell && recCell.supplier ? `<span class="sub">${esc(recCell.supplier)}</span>` : ""}</td>
        <td>${num(site.eac)}</td>` + effHtml + costCells.join("") + diffHtml + `</tr>`;
    }).join("") + `</tbody></table></div></section>`;
}

/* ---- Rate books per offer ---- */
function buildRateBooks() {
  const rateCols = [
    ["unitRate", "Unit p/kWh"], ["dayRate", "Day p/kWh"], ["nightRate", "Night p/kWh"],
    ["standingCharge", "Standing"], ["capacityCharge", "Capacity"],
    ["networkCharge", "Network"], ["meterCharge", "Meter"],
  ];
  // The four non-commodity columns state the unit they are COSTED on. Read it from
  // the OFFER's own chargeBasis (compute_offer already emits it) rather than
  // hardcoding "p/day": charge_basis is overridable per tender AND per offer, so a
  // hardcoded unit could state a falsehood on a client page — the presentation-layer
  // twin of the p/kWh network mis-cost. chargeBasis only ever carries those four
  // keys, so the energy columns keep their own p/kWh and are never double-suffixed.
  // An offer with no chargeBasis degrades to the bare label, never to a guess.
  const BASIS_UNIT = {
    "p/day": "p/day", "p/mpan/day": "p/MPAN/day", "p/kva/day": "p/kVA/day",
    "p/kwh": "p/kWh", "gbp/day": "£/day", "gbp/month": "£/month", "gbp/year": "£/year",
  };
  const colsFor = o => {
    const cb = o.chargeBasis || {};
    return rateCols.map(([k, lbl]) => {
      const u = BASIS_UNIT[cb[k]];
      return [k, u ? `${lbl}<span class="unit">${u}</span>` : lbl];
    });
  };
  // Contract dates (Start / End) show only on real supplier offers — the
  // incumbent/benchmark baseline has no quoted term to show.
  let anyEstimated = false;
  const body = allOffers.map(o => {
      const used = colsFor(o).filter(([k]) => o.sites.some(s => s.rates[k] != null));
      const showDates = !o.isIncumbent;
      const warn = o.warnings.length
        ? `<div class="notice" style="margin:12px 20px">` +
          o.warnings.map(w => `<div><span class="chip warning">note</span>${esc(w)}</div>`).join("") + `</div>` : "";
      return `<details>
        <summary><span class="caret">▶</span>${esc(o.supplier)}
          <span class="chip ${o.isIncumbent ? "warning" : "neutral"}">${esc(o.isIncumbent ? baseChip : o.term)}</span>
          <span style="margin-left:auto" class="chip neutral">${gbp(o.total)}/yr</span></summary>
        ${warn}
        <div class="table-wrap"><table>
          <thead><tr><th>Supply</th><th>EAC kWh</th>` +
          used.map(([, lbl]) => `<th>${lbl}</th>`).join("") +
          (showDates ? `<th>Start</th><th>End</th>` : "") +
          `<th>£/year</th></tr></thead><tbody>` +
        o.sites.map(s => {
          let dateCells = "";
          if (showDates) {
            const est = s.endEstimated && s.endDate;
            if (est) anyEstimated = true;
            dateCells = `<td>${fmtDate(s.startDate)}</td>` +
              `<td>${fmtDate(s.endDate)}${est ? `<span class="est">*</span>` : ""}</td>`;
          }
          return `<tr>
          <td class="name">${esc(s.name)}<span class="sub">${esc(s.mpxn)}</span></td>
          <td>${num(s.eac)}</td>` +
          used.map(([k]) => `<td>${num(s.rates[k])}</td>`).join("") +
          dateCells +
          `<td class="total">${gbp(s.total)}</td></tr>`;
        }).join("") +
        `</tbody></table></div></details>`;
    }).join("");
  const estNote = anyEstimated
    ? `<div class="est-note"><span class="est">*</span> End date estimated from the contract length where the quote did not state one.</div>`
    : "";
  return `<section><div class="section-label">Quoted rates — full detail</div>` + body + estNote + `</section>`;
}

/* ================= compose ================= */
/* Electricity is the anchor. A combined tender rolls gas into the Summary only
   when the client ticks it in, and switches fuel within the Portfolio tab. The
   RYE charge is whole-tender (all meters) regardless of the tick. */
function recOf(f) { return (f.offers || []).find(o => o.id === (f.recommendedId || f.bestId)) || (f.offers || [])[0]; }
function siteSuppliers(offer) { return offer ? [...new Set(offer.sites.map(s => s.supplier || offer.supplier).filter(Boolean))] : []; }
function supplierLabel(list) { const u = [...new Set(list)].filter(Boolean); return u.length === 0 ? "" : (u.length <= 3 ? u.join(" + ") : "Best of market mix"); }

/* Shared arithmetic for the combined-tender Summary — ONE source of truth for the
   builder and the live recompute, so the two can never drift. Electricity is the
   default basis; the include-gas tick switches to the combined one. */
function summaryFigures() {
  const P = FUELS[primaryIndex];
  const gas = FUELS.filter((_, i) => i !== primaryIndex)
    .filter(f => (f.offers || []).length)
    .map(f => ({ f, rec: recOf(f), inc: f.incumbent }));
  const eRec = recOf(P), eInc = P.incumbent;
  const haveAll = !!eInc && gas.every(g => g.inc);
  const cInc = haveAll ? eInc.total + gas.reduce((a, g) => a + g.inc.total, 0) : null;
  const cRec = eRec.total + gas.reduce((a, g) => a + g.rec.total, 0);
  return {
    P, gas, eRec, eInc,
    eGross: eInc ? eInc.total - eRec.total : 0,
    cGross: cInc != null ? cInc - cRec : null,
    eIncTotal: eInc ? eInc.total : 0, cIncTotal: cInc,
    eRecTotal: eRec.total, cRecTotal: cRec,
    eSites: P.sites.length || 1,
    cSites: FUELS.reduce((a, f) => a + ((f.sites || []).length), 0) || 1,
    eEac: eRec.eac || 0,
    cEac: (eRec.eac || 0) + gas.reduce((a, g) => a + (g.rec.eac || 0), 0),
  };
}

/* RYE's charge on the basis currently on screen. Commission is p/kWh, so it scopes
   exactly to the fuels displayed — an electricity-only saving must never be netted
   against the whole tender's commission (that made the two KPIs irreconcilable).
   The flat fee is whole-client by design and does not scope; its sub-line says so. */
function chargeOn(F, on, psmOverride) {
  const comm = RAW.commission, fee = RAW.fee;
  const gross = on ? F.cGross : F.eGross;
  if (comm) {
    const annual = (comm.pKwhUplift || 0) * (on ? F.cEac : F.eEac) / 100;
    return { kind: "commission", label: comm.label || "RYE commission", annual,
      included: !!comm.included,
      net: gross == null ? null : gross - (comm.included ? 0 : annual),
      scope: on ? "the tender" : (F.P.fuelLabel || "electricity").toLowerCase() };
  }
  if (fee) {
    const psm = psmOverride == null ? fee.perSiteMonth : psmOverride;
    // The fee may be charged on fewer supply points than the tender covers.
    const annual = Math.max(0, psm || 0) * feeChargedPts(fee) * 12;
    return { kind: "fee", label: fee.label || "RYE fee", annual, included: false,
      net: gross == null ? null : gross - annual, scope: null };
  }
  return null;
}

/* A saving is a saving and an increase is an increase — never a green minus sign. */
const saveWord = v => (v == null ? "saving" : v >= 0 ? "saving" : "increase");
const saveTone = v => (v != null && v < 0 ? "warn" : "pos");

function buildSummaryMulti() {
  const F = summaryFigures();
  const { P, gas, eRec, eInc, eGross } = F;
  const comm = RAW.commission;
  const lead = isBenchmark ? "Indicative" : "Forecasted";
  const eSup = supplierLabel(siteSuppliers(eRec));
  const cSup = supplierLabel([...siteSuppliers(eRec), ...gas.flatMap(g => siteSuppliers(g.rec))]);
  const pk = (v, cls) => `<td class="${cls || ""}">${v == null ? "—" : Number(v).toFixed(2)}</td>`;
  const sw = (e, c) => `<span class="gswap" data-e="${esc(String(e))}" data-c="${esc(String(c))}">${esc(String(e))}</span>`;
  const ePct = eInc ? (Math.abs(eGross) / eInc.total * 100).toFixed(1) : "0.0";
  const ch = chargeOn(F, false);

  /* Tone is COMPARED, exactly as the electricity effective row is — a dearer gas
     rate must not read green just because it is the recommended offer. */
  const gasRows = gas.map(g => {
    const gi = g.inc ? g.inc.perKwh.effective : null, gr = g.rec.perKwh.effective;
    return `<tr class="gas-row" hidden><td class="name">Mean effective rate — ${esc(g.f.fuelLabel.toLowerCase())} (p/kWh)</td>` +
      pk(gi, gi == null ? "" : "neg") + pk(gr, gi == null ? "" : (gr <= gi ? "best" : "warn")) + `</tr>`;
  }).join("");

  let charge = "";
  if (ch && ch.kind === "fee") {
    charge = `
      <div class="kpi-label" style="margin-top:14px" id="m-net-label">Net ${saveWord(ch.net)} after ${esc(ch.label)}</div>
      <div class="kpi-value ${saveTone(ch.net)}" id="m-net" style="font-size:26px;margin-top:6px">${gbp(Math.abs(ch.net))}</div>
      <div class="kpi-sub">fee <span id="m-fee-annual">${gbp(ch.annual)}</span>/yr across ${F.cSites} supply point${F.cSites === 1 ? "" : "s"}</div>
      <div class="fee-controls">
        <div class="kpi-label" style="margin-bottom:10px">RYE fee</div>
        <input type="range" id="m-fee-slider" min="0" max="100" step="5" value="${feeSliderPct(RAW.fee)}" aria-label="RYE fee discount">
        <div style="display:flex;align-items:center;gap:8px;margin-top:10px">
          <input type="number" id="m-fee-input" min="0" step="0.5" value="${RAW.fee.perSiteMonth}" aria-label="Fee per supply point per month">
          <span style="font-family:var(--rye-mono);font-size:11px;color:var(--t3)">£/supply point/month · <span id="m-fee-disc"></span></span>
        </div>
      </div>`;
  } else if (ch && ch.kind === "commission") {
    charge = ch.included ? `
      <div class="kpi-sub" style="margin-top:14px">${esc(ch.label)} ${comm.pKwhUplift} p/kWh ·
        <span id="m-fee-annual">${gbp(ch.annual)}</span>/yr across <span id="m-charge-scope">${esc(ch.scope)}</span> · already in the rate above</div>` : `
      <div class="kpi-label" style="margin-top:14px" id="m-net-label">Net ${saveWord(ch.net)} after ${esc(ch.label)}</div>
      <div class="kpi-value ${saveTone(ch.net)}" id="m-net" style="font-size:26px;margin-top:6px">${gbp(Math.abs(ch.net))}</div>
      <div class="kpi-sub">${comm.pKwhUplift} p/kWh · <span id="m-fee-annual">${gbp(ch.annual)}</span>/yr across <span id="m-charge-scope">${esc(ch.scope)}</span></div>`;
  }

  return `<section>
    <div class="section-label">Our recommendation — <span class="gswap" data-e="${esc(eSup)}" data-c="${esc(cSup)}">${esc(eSup)}</span> · ${esc(eRec.term)}</div>
    ${gas.length ? `<label class="gas-toggle" style="display:inline-flex;align-items:center;gap:8px;margin:2px 0 14px;cursor:pointer;font-size:13px;color:var(--t2)"><input type="checkbox" id="inc-gas"> Include gas in these figures</label>` : ""}
    <div style="display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:14px" class="rec-grid">
      <div class="card accent-green">
        <span class="chip success">recommended</span>
        <div style="font-size:22px;font-weight:600;letter-spacing:-0.02em;margin-top:12px"><span class="gswap" data-e="${esc(eSup)}" data-c="${esc(cSup)}">${esc(eSup)}</span></div>
        <div class="kpi-sub">${esc(eRec.term)} · electricity anchor${gas.length ? ` · gas via ${gas.map(g => esc(supplierLabel(siteSuppliers(g.rec)))).join(", ")}` : ""}</div>
        <div class="kpi-label" style="margin-top:18px" id="m-gross-label">${lead} annual ${saveWord(eGross)}</div>
        <div class="kpi-value ${saveTone(eGross)}" id="m-gross" style="font-size:40px;margin-top:8px">${gbp(Math.abs(eGross))}</div>
        <div class="kpi-sub"><span id="m-pct">${ePct}</span>% vs ${baseLc}</div>
        ${charge}
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Standardised comparison</th><th>${baseLabel}</th><th>Recommended</th></tr></thead>
        <tbody>
          <tr><td class="name">Mean unit rate — electricity (p/kWh)</td>${pk(eInc ? eInc.perKwh.unit : null)}${pk(eRec.perKwh.unit, eInc && eRec.perKwh.unit <= eInc.perKwh.unit ? "best" : "")}</tr>
          <tr><td class="name">Mean non-commodity — electricity (p/kWh)</td>${pk(eInc ? eInc.perKwh.nonCommodity : null)}${pk(eRec.perKwh.nonCommodity, eInc && eRec.perKwh.nonCommodity <= eInc.perKwh.nonCommodity ? "best" : "")}</tr>
          <tr><td class="name">Mean effective rate — electricity (p/kWh)</td>${pk(eInc ? eInc.perKwh.effective : null, "neg")}${pk(eRec.perKwh.effective, eInc && eRec.perKwh.effective <= eInc.perKwh.effective ? "best" : "warn")}</tr>
          ${gasRows}
          <tr><td class="name">Forecasted annual spend</td><td>${sw(gbp(F.eIncTotal), F.cIncTotal != null ? gbp(F.cIncTotal) : "—")}</td><td>${sw(gbp(F.eRecTotal), gbp(F.cRecTotal))}</td></tr>
          <tr><td class="name">Annual spend per supply</td><td>${sw(gbp(F.eIncTotal / F.eSites), F.cIncTotal != null ? gbp(F.cIncTotal / F.cSites) : "—")}</td><td>${sw(gbp(F.eRecTotal / F.eSites), gbp(F.cRecTotal / F.cSites))}</td></tr>
          <tr><td class="name">${lead} annual saving</td><td></td><td class="${eGross >= 0 ? "best" : "warn"}" id="m-savecell">${sw(gbpSigned(F.eRecTotal - F.eIncTotal), F.cGross != null ? gbpSigned(F.cRecTotal - F.cIncTotal) : "—")}</td></tr>
        </tbody>
      </table></div>
    </div>
  </section>`;
}

/* ONE set of Summary bars. Electricity only by default; on the include-gas tick each
   bar GROWS by a gas segment, so its length is the client's total annual spend.
   The two fuels are tendered separately, so a non-recommended electricity offer has no
   gas twin: every offer bar carries the RECOMMENDED gas offer (held constant across the
   bars, which keeps the comparison like-for-like), while the incumbent carries its OWN
   current gas — the baseline has to be what they actually pay. The footnote says so. */
function summaryBars(on) {
  const P = FUELS[primaryIndex];
  const secs = FUELS.filter((_, i) => i !== primaryIndex).filter(f => (f.offers || []).length);
  const gasRec = secs.reduce((a, f) => a + ((recOf(f) || {}).total || 0), 0);
  const gasIncKnown = secs.length > 0 && secs.every(f => f.incumbent);
  const gasInc = secs.reduce((a, f) => a + (f.incumbent ? f.incumbent.total : 0), 0);
  const recId = P.recommendedId || P.bestId;
  const split = on && secs.length > 0;
  const rows = (P.incumbent ? [P.incumbent] : []).concat(P.offers).map(o => {
    const g = !split ? 0 : (o.isIncumbent ? (gasIncKnown ? gasInc : gasRec) : gasRec);
    return { o, elec: o.total, gas: g, total: o.total + g };
  }).sort((a, b) => a.total - b.total);
  const maxTotal = Math.max(...rows.map(r => r.total)) || 1;
  const CAT_LABELS = { coterminous: "Coterminous", fixed: "Fixed length" };
  const catLabel = c => CAT_LABELS[c] || (c.charAt(0).toUpperCase() + c.slice(1));
  const cats = [...new Set(P.offers.filter(o => o.category).map(o => o.category))];
  const fuelBit = secs.length ? (split ? " — electricity + gas" : " — electricity") : "";

  const bars = rows.map((r, i) => {
    const o = r.o;
    const fill = o.isIncumbent ? "var(--rye-amber-fill)"
      : o.id === recId ? "var(--rye-green-fill)" : "rgba(237,237,237,0.7)";
    const chip = o.isIncumbent ? `<span class="chip warning">${baseChip}</span>`
      : o.id === recId ? `<span class="chip success">recommended</span>` : "";
    const ew = (r.elec / maxTotal * 100).toFixed(1), gw = (r.gas / maxTotal * 100).toFixed(1);
    const tip = r.gas ? `${esc(o.supplier)} — electricity ${gbp(r.elec)} + gas ${gbp(r.gas)}` : "";
    return `<div class="bar-row" data-cat="${esc(o.category || 'other')}"${tip ? ` title="${tip}"` : ""}>
      <div class="bar-name">${esc(o.supplier)}${o.isIncumbent && isBenchmark ? "" : `<span class="term">${esc(o.term)}</span>`}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${ew}%;background:${fill};animation-delay:${i * 60}ms"></div>
        ${r.gas ? `<div class="bar-fill bar-gas" style="left:${ew}%;width:${gw}%;background:${fill};animation-delay:${i * 60 + 600}ms"></div>` : ""}
      </div>
      <div class="bar-val">${gbp(r.total)} ${chip}</div>
    </div>`;
  }).join("");

  const legend = split ? `<div class="bar-legend">
      <span class="lg"><span class="sw" style="background:rgba(237,237,237,0.7)"></span>electricity</span>
      <span class="lg"><span class="sw bar-gas-sw" style="background:rgba(237,237,237,0.7)"></span>gas</span>
    </div>` : "";

  return `<section>
    <div class="offer-filter-row">
      <div class="section-label">All offers tendered${fuelBit} · estimated annual cost</div>
      ${cats.length >= 2 ? `<div class="offer-filter" id="offer-filter-sum"><button data-f="all" class="on">All</button>${cats.map(c => `<button data-f="${esc(c)}">${esc(catLabel(c))}</button>`).join("")}</div>` : ""}
    </div>
    <div class="card"><div class="bars">${bars}</div>${legend}</div>
  </section>`;
}

function portfolioBody(i) {
  setState(FUELS[i]);
  return buildBars({ idSuffix: "-pf" + i }) + buildBreakdown() + buildSiteMatrix() + buildRateBooks();
}

function fuelBtnStyle(active) {
  return `padding:7px 18px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;border:1px solid ${active ? '#0cce6b' : 'rgba(237,237,237,0.18)'};background:${active ? '#0cce6b' : 'rgba(255,255,255,0.04)'};color:${active ? '#04110a' : '#ededed'}`;
}

function renderMulti() {
  const P = FUELS[primaryIndex];
  setState(P);
  const canSummary = !!P.incumbent;
  const savingsPane = canSummary ? (buildBenchmarkNotice() + buildSummaryMulti()
    + `<div id="summary-bars">${summaryBars(false)}</div>`) : "";
  const switchBar = `<div id="fuelswitch" style="display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap">` +
    FUELS.map((f, i) => `<button class="fuelbtn" data-fi="${i}" onclick="switchPortfolioFuel(${i})" style="${fuelBtnStyle(i === activePortfolioFuel)}">${esc(f.fuelLabel || f.utility)}</button>`).join("") + `</div>`;
  const portfolioPane = switchBar + `<div id="portfolio-body">${portfolioBody(activePortfolioFuel)}</div>`;
  setState(P);
  const hasMarketTop = !!(RAW.market && (RAW.market.power || RAW.market.gas));
  const marketPane = hasMarketTop ? buildMarketPane() : "";
  const tabs = [];
  if (canSummary) tabs.push(["savings", "Summary"]);
  tabs.push(["portfolio", "Portfolio"]);
  if (hasMarketTop) tabs.push(["market", "Market Review"]);
  const defaultTab = canSummary ? "savings" : "portfolio";
  let html = buildHero() + buildWarnings();
  if (tabs.length > 1) {
    html += `<div class="tabbar" role="tablist">` + tabs.map(([id, label]) =>
      `<div class="tab ${id === defaultTab ? "active" : ""}" data-tab="${id}" onclick="showTab('${id}')">${esc(label)}</div>`).join("") + `</div>`;
  }
  if (canSummary) html += `<div id="tab-savings" class="tabpane"${defaultTab === "savings" ? "" : " hidden"}>${savingsPane}</div>`;
  html += `<div id="tab-portfolio" class="tabpane"${defaultTab === "portfolio" ? "" : " hidden"}>${portfolioPane}</div>`;
  if (hasMarketTop) html += `<div id="tab-market" class="tabpane" hidden>${marketPane}</div>`;
  setState(P);
  html += buildFooter();
  document.getElementById("app").innerHTML = html;
  setState(P);
  wireSummaryMulti();
  wireOfferFilter();
  if (hasMarketTop) renderMarket();
}

function buildFooter() {
  const chargingNote = fee
    ? "independent, flat-fee energy brokerage — we take no supplier commission"
    : "independent energy brokerage · we work for you, not the supplier";
  return `<footer>
    <div class="section-label">Basis of comparison</div>
    <ul class="assumptions">${TENDER.assumptions.map(a => `<li>${esc(a)}</li>`).join("")}${fee ? `<li id="assump-fee"></li>` : ""}</ul>
    <div class="prepared">Prepared by RYE · ${chargingNote} ·
      generated ${TENDER.generated}</div>
  </footer>`;
}

function render() {
  if (MULTI) { renderMulti(); return; }
  setState(FUELS[activeFuel]);
  const savingsPane = hasInc ? (buildBenchmarkNotice() + buildRecVsInc() + buildBars({ idSuffix: "-sum" })) : "";
  const portfolioPane =
    (!hasInc ? (commission ? buildCommission() : (fee ? buildFeeStandalone() : "")) : "")
    + (!hasInc ? buildBars({ idSuffix: "-pf" }) : "")
    + buildBreakdown() + buildSiteMatrix() + buildRateBooks();
  const marketPane = hasMarket ? buildMarketPane() : "";
  const timelinePane = hasTimeline ? buildTimelinePane() : "";
  const tabs = [];
  if (hasInc) tabs.push(["savings", "Summary"]);
  tabs.push(["portfolio", "Portfolio"]);
  if (hasTimeline) tabs.push(["timeline", "Savings timeline"]);
  if (hasMarket) tabs.push(["market", "Market Review"]);
  const defaultTab = hasInc ? "savings" : "portfolio";
  let html = buildHero() + buildWarnings();
  if (tabs.length > 1) {
    html += `<div class="tabbar" role="tablist">` + tabs.map(([id, label]) =>
      `<div class="tab ${id === defaultTab ? "active" : ""}" data-tab="${id}" onclick="showTab('${id}')">${esc(label)}</div>`).join("") + `</div>`;
  }
  if (hasInc) html += `<div id="tab-savings" class="tabpane"${defaultTab === "savings" ? "" : " hidden"}>${savingsPane}</div>`;
  html += `<div id="tab-portfolio" class="tabpane"${defaultTab === "portfolio" ? "" : " hidden"}>${portfolioPane}</div>`;
  if (hasTimeline) html += `<div id="tab-timeline" class="tabpane" hidden>${timelinePane}</div>`;
  if (hasMarket) html += `<div id="tab-market" class="tabpane" hidden>${marketPane}</div>`;
  html += buildFooter();
  document.getElementById("app").innerHTML = html;
  wireEvents();
  if (hasMarket) renderMarket();
  if (hasTimeline) renderTimeline();
}

/* ---- Tab switching ---- */
function showTab(t) {
  document.querySelectorAll(".tabpane").forEach(p => { p.hidden = (p.id !== "tab-" + t); });
  document.querySelectorAll(".tab").forEach(el => el.classList.toggle("active", el.dataset.tab === t));
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function switchPortfolioFuel(i) {
  activePortfolioFuel = i;
  document.getElementById("portfolio-body").innerHTML = portfolioBody(i);
  document.querySelectorAll("#fuelswitch .fuelbtn").forEach(b => {
    b.setAttribute("style", fuelBtnStyle(+b.dataset.fi === i));
  });
  wireOfferFilter();
  setState(FUELS[primaryIndex]);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* Wire every offer filter on the page, each scoped to its OWN bars block. The
   Summary and Portfolio panes both render bars (and a combined tender renders one
   set per fuel), so a single getElementById wired the first and filtered them all. */
function wireOfferFilter() {
  document.querySelectorAll(".offer-filter").forEach(fw => {
    if (fw.dataset.wired) return;
    fw.dataset.wired = "1";
    const scope = fw.closest("section") || document;
    const rows = Array.from(scope.querySelectorAll(".bars .bar-row"));
    fw.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      const f = b.dataset.f;
      rows.forEach(r => { r.style.display = (f === "all" || r.dataset.cat === f) ? "" : "none"; });
      fw.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    });
  });
}
function wireSummaryMulti() {
  const F = summaryFigures();
  const el = id => document.getElementById(id);
  const cb = el("inc-gas");
  const fee = RAW.fee;
  const lead = isBenchmark ? "Indicative" : "Forecasted";
  const list = fee ? (fee.listPerSiteMonth || 90) : 90;
  const slider = el("m-fee-slider"), input = el("m-fee-input");
  let psm = fee ? fee.perSiteMonth : 0;
  const tone = (node, v) => {
    if (!node) return;
    node.classList.toggle("pos", !(v != null && v < 0));
    node.classList.toggle("warn", v != null && v < 0);
  };

  function recompute() {
    const on = !!(cb && cb.checked && F.cGross != null);
    const gross = on ? F.cGross : F.eGross;
    const incT = on ? F.cIncTotal : F.eIncTotal;
    document.querySelectorAll(".gswap").forEach(x => { x.textContent = on ? x.dataset.c : x.dataset.e; });
    document.querySelectorAll(".gas-row").forEach(r => { r.hidden = !on; });
    const sb = el("summary-bars");
    if (sb) { sb.innerHTML = summaryBars(on); wireOfferFilter(); }
    if (el("m-gross")) { el("m-gross").textContent = gbp(Math.abs(gross)); tone(el("m-gross"), gross); }
    if (el("m-gross-label")) el("m-gross-label").textContent = `${lead} annual ${saveWord(gross)}`;
    if (el("m-pct")) el("m-pct").textContent = incT ? (Math.abs(gross) / incT * 100).toFixed(1) : "0.0";
    const cell = el("m-savecell");
    if (cell) { cell.classList.toggle("best", gross >= 0); cell.classList.toggle("warn", gross < 0); }
    const ch = chargeOn(F, on, fee ? psm : null);
    if (ch) {
      if (el("m-fee-annual")) el("m-fee-annual").textContent = gbp(ch.annual);
      if (el("m-fee-disc")) el("m-fee-disc").textContent = feeRateNote(fee, psm);
      if (el("m-charge-scope")) el("m-charge-scope").textContent = ch.scope || "";
      if (el("m-net")) { el("m-net").textContent = gbp(Math.abs(ch.net)); tone(el("m-net"), ch.net); }
      if (el("m-net-label")) el("m-net-label").textContent = `Net ${saveWord(ch.net)} after ${ch.label}`;
    }
  }
  if (cb) cb.addEventListener("change", recompute);
  if (slider) slider.addEventListener("input", () => { psm = +(list * (1 - slider.value / 100)).toFixed(2); if (input) input.value = psm; recompute(); });
  if (input) input.addEventListener("input", () => { psm = parseFloat(input.value) || 0; if (slider) slider.value = Math.min(100, Math.max(0, Math.round((1 - psm / list) * 100))); recompute(); });
  recompute();
}
/* Re-attach the offer filter + live fee control after every (re)render. */
function wireEvents() {
  wireOfferFilter();
/* ---- Live fee control: net saving recalculates as the fee moves ---- */
if (fee) {
  const sites = feeTotalPts(fee);        // every supply point in the tender
  const charged = feeChargedPts(fee);    // how many of them the fee is charged on
  const capped = charged < sites;
  const gross = savings;                 // null when there is no incumbent baseline
  const list = fee.listPerSiteMonth || 90;
  const slider = document.getElementById("fee-slider");
  const input = document.getElementById("fee-input");
  const el = id => document.getElementById(id);

  function apply(psm) {
    psm = Math.max(0, psm || 0);
    const annual = psm * charged * 12;
    const blended = sites ? annual / (12 * sites) : 0;
    if (el("fee-annual")) el("fee-annual").textContent = gbp(annual);
    if (el("fee-disc")) el("fee-disc").textContent = feeRateNote(fee, psm);
    // The control underneath already states the discount, so the note just
    // carries the list rate and what it works out at across the portfolio.
    if (el("fee-note")) el("fee-note").textContent = capped
      ? `${gbp2(psm)}/supply point/month · equivalent to ${gbp2(blended)} per supply across ${sites} supplies`
      : `${gbp2(psm)}/supply point/month × ${sites} suppl${sites === 1 ? "y" : "ies"} × 12 months`;
    if (gross != null) {                 // net saving only exists with a baseline
      const net = gross - annual;
      if (el("net-saving-label")) el("net-saving-label").textContent = `Net ${saveWord(net)} after ${fee.label}`;
      if (el("net-saving")) {
        el("net-saving").textContent = gbp(Math.abs(net));
        el("net-saving").classList.toggle("pos", net >= 0);
        el("net-saving").classList.toggle("warn", net < 0);
      }
      if (el("net-per-site")) el("net-per-site").textContent = gbp(Math.abs(net / sites));
      if (el("kpi-net")) el("kpi-net").textContent = gbp(net);
    }
    if (el("assump-fee")) el("assump-fee").textContent =
      `${fee.label}: £${psm.toFixed(2)}/supply point/month ` +
      `(£${Math.round(annual).toLocaleString("en-GB")}/year` +
      `${capped ? `, equivalent to £${blended.toFixed(2)} per supply` : ""} ` +
      `across ${sites} suppl${sites === 1 ? "y" : "ies"}). ` +
      `RYE charges a flat subscription fee and takes no supplier commission.`;
  }

  if (slider) slider.addEventListener("input", () => {
    const psm = +(list * (1 - slider.value / 100)).toFixed(2);
    input.value = psm;
    apply(psm);
  });
  if (input) input.addEventListener("input", () => {
    const psm = parseFloat(input.value) || 0;
    slider.value = Math.min(100, Math.max(0, Math.round((1 - psm / list) * 100)));
    apply(psm);
  });
  apply(fee.perSiteMonth);
}
}


/* ================= Savings timeline =================
   Supplies in a portfolio rarely all switch on the same day, so the headline
   annual figure is a RUN RATE. This tab shows what actually lands, month by
   month, as each supply point moves across — and the gap between the two.
   TWO charts, never one with two y-axes: monthly rate and cumulative total are
   different scales and a dual axis is the classic way to mislead with both. */
function tlWord() { return timeline.runRateAnnual >= 0 ? "saving" : "increase"; }
function tlColor() { return timeline.runRateAnnual >= 0 ? "var(--rye-green)" : "var(--rye-amber)"; }
function tlTone() { return timeline.runRateAnnual >= 0 ? "pos" : "warn"; }
function tlAccent() { return timeline.runRateAnnual >= 0 ? "accent-green" : "accent-amber"; }
function tlMonthLabel(m) { return m.label; }
/* Axis ticks land on round numbers (1 / 2 / 2.5 / 5 x 10^n), not on whatever the
   data max happens to divide into — "1,881 / 1,410 / 940" reads like a rounding
   error, "2,000 / 1,500 / 1,000" reads like a scale. */
function tlNice(v, ticks) {
  if (!(v > 0)) return { max: ticks, step: 1 };
  const raw = v / ticks, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  return { max: step * ticks, step };
}

function buildTimelinePane() {
  const t = timeline, w = tlWord(), lead = isBenchmark ? "Indicative" : "Forecasted";
  const months = t.months;
  const table = t.supplies.map(s => `<tr>
      <td class="name">${esc(s.name)}<span class="sub">${esc(s.mpxn)}</span></td>
      <td>${s.startDate ? fmtMonth(s.startDate) : "—"}</td>
      <td class="${s.monthlySaving >= 0 ? "best" : "warn"}">${gbp(Math.abs(s.monthlySaving))}</td>
      <td class="${s.annualSaving >= 0 ? "best" : "warn"}">${gbp(Math.abs(s.annualSaving))}</td>
    </tr>`).join("");

  return `<section>
    ${t.staggered || t.losingCount ? `<p class="subtitle" style="margin:0 0 20px;max-width:760px">
      ${t.staggered ? `Your incumbent contracts end on different dates. Below is how ${w}s accrue as each
        RYE contract goes live. The full monthly ${w} applies once the last supply point has
        switched${t.allLiveFrom ? `, in ${fmtMonth(t.allLiveFrom)}` : ""}.` : ""}
      ${t.losingCount ? `${t.savingCount} of the ${t.supplyCount} supply points
        ${t.savingCount === 1 ? "saves" : "save"} on the new contract;
        ${t.losingCount === 1 ? "one shows" : `${t.losingCount} show`} an increase, typically where a
        meter is already on a competitive legacy rate. All ${t.supplyCount} are included in every figure
        below.` : ""}
    </p>` : ""}
    ${isBenchmark ? `<div class="notice"><span class="chip warning">benchmark</span>
      Measured against UK market average costs rather than your actual contract, so these
      figures are indicative.</div>` : ""}

    <div class="section-label">What this is worth</div>
    <div class="kpi-row">
      <div class="card ${tlAccent()}">
        <div class="kpi-label">${lead} annual ${w} — run rate</div>
        <div class="kpi-value ${tlTone()}">${gbp(Math.abs(t.runRateAnnual))}</div>
        <div class="kpi-sub">once all ${t.supplies.length} supply points are on contract</div>
      </div>
      <div class="card ${tlAccent()}">
        <div class="kpi-label">${w === "saving" ? "Saving" : "Increase"} in the first 12 months</div>
        <div class="kpi-value ${tlTone()}">${gbp(Math.abs(t.firstYear))}</div>
        <div class="kpi-sub">${t.staggered
          ? `${Math.round(Math.abs(t.firstYear) / Math.abs(t.runRateAnnual || 1) * 100)}% of the run rate — supplies join through the year`
          : "all supply points live from the start"}</div>
      </div>
      <div class="card ${tlAccent()}">
        <div class="kpi-label">Total over the ${t.termMonths}-month term</div>
        <div class="kpi-value ${tlTone()}">${gbp(Math.abs(t.totalOverTerm))}</div>
        <div class="kpi-sub">cumulative, to the end of the contract</div>
      </div>
    </div>

    <div class="section-label" style="margin-top:26px">${lead} ${w} per month (£)</div>
    <svg id="tl-bars" class="mchart" viewBox="0 0 1040 210"></svg>

    <div class="section-label" style="margin-top:22px">Cumulative ${w} (£)</div>
    <svg id="tl-cum" class="mchart" viewBox="0 0 1040 210"></svg>

    <div class="section-label" style="margin-top:26px">When each supply point moves</div>
    <div class="table-wrap"><table>
      <thead><tr><th>Supply</th><th>Moves onto contract</th><th>Per month</th><th>Per year</th></tr></thead>
      <tbody>${table}
        <tr class="total-row">
          <td class="name">All ${t.supplyCount} supply points</td><td></td>
          <td class="${t.runRateAnnual >= 0 ? "best" : "warn"}">${gbp(Math.abs(t.runRateAnnual / 12))}</td>
          <td class="${t.runRateAnnual >= 0 ? "best" : "warn"}">${gbp(Math.abs(t.runRateAnnual))}</td>
        </tr></tbody>
    </table></div>

    <ul class="assumptions">
      <li>Each supply point's annual ${w} is spread evenly across the twelve months it is live. We hold
        annual consumption per meter, not monthly, so the month-to-month shape of your usage is not
        modelled — the steps in the chart are the dates supplies move across, which are exact.</li>
      ${t.notes.map(n => `<li>${esc(n)}</li>`).join("")}
      <li>Figures assume the quoted rates and your current annual consumption, on the same
        standardised basis as the rest of this page.</li>
    </ul>
  </section>`;
}

const fmtMonth = iso => {
  const d = new Date(String(iso).slice(0, 10) + "T00:00:00");
  return isNaN(d) ? String(iso) : d.toLocaleDateString("en-GB", { month: "short", year: "numeric" });
};

/* Bars: one series, so no legend — the section label names it. Recessive grid,
   direct label on the peak only, native <title> for hover. */
function tlBars(id, months, W, H) {
  const svg = document.getElementById(id);
  if (!svg) return;
  const padL = 46, padR = 14, padT = 12, padB = 24;
  const vals = months.map(m => Math.abs(m.monthly));
  const max = tlNice(Math.max(...vals, 1), 4).max;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const bw = Math.max(2, innerW / months.length - 2);
  const Y = v => padT + (1 - v / max) * innerH;
  let s = "";
  for (let i = 0; i <= 4; i++) {
    const val = max * i / 4, y = Y(val);
    s += `<line class="gridln" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"/>`;
    s += `<text class="axlabel" x="${padL - 6}" y="${y + 3}" text-anchor="end">${Math.round(val).toLocaleString("en-GB")}</text>`;
  }
  const everyNth = Math.max(1, Math.round(months.length / 8));
  let peak = 0;
  months.forEach((m, i) => { if (Math.abs(m.monthly) > Math.abs(months[peak].monthly)) peak = i; });
  months.forEach((m, i) => {
    const v = Math.abs(m.monthly), x = padL + i * innerW / months.length, y = Y(v);
    s += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(0, padT + innerH - y)}" rx="1"
            fill="${tlColor()}" opacity="0.85"><title>${esc(m.label)}: £${Math.round(v).toLocaleString("en-GB")}/month · ${m.live} supply point${m.live === 1 ? "" : "s"} live</title></rect>`;
    if (i % everyNth === 0) s += `<text class="axlabel" x="${x + bw / 2}" y="${H - 7}" text-anchor="middle">${esc(m.label)}</text>`;
  });
  const pv = Math.abs(months[peak].monthly);
  s += `<text class="mk" x="${padL + peak * innerW / months.length + bw / 2}" y="${Y(pv) - 6}" text-anchor="middle" fill="var(--t1)">£${Math.round(pv).toLocaleString("en-GB")}</text>`;
  svg.innerHTML = s;
}

/* Cumulative: its own chart with its own axis — never a second y-scale on the bars. */
function tlCum(id, months, W, H) {
  const svg = document.getElementById(id);
  if (!svg) return;
  const padL = 46, padR = 14, padT = 12, padB = 24;
  const vals = months.map(m => Math.abs(m.cumulative));
  const max = tlNice(Math.max(...vals, 1), 4).max;
  const innerW = W - padL - padR, innerH = H - padT - padB, n = months.length;
  const X = i => padL + (n === 1 ? innerW / 2 : i * innerW / (n - 1));
  const Y = v => padT + (1 - v / max) * innerH;
  let s = "";
  for (let i = 0; i <= 4; i++) {
    const val = max * i / 4, y = Y(val);
    s += `<line class="gridln" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"/>`;
    s += `<text class="axlabel" x="${padL - 6}" y="${y + 3}" text-anchor="end">${Math.round(val).toLocaleString("en-GB")}</text>`;
  }
  let area = `M ${X(0)} ${Y(vals[0])}`;
  vals.forEach((v, i) => area += ` L ${X(i)} ${Y(v)}`);
  area += ` L ${X(n - 1)} ${padT + innerH} L ${X(0)} ${padT + innerH} Z`;
  s += `<path d="${area}" fill="${tlColor()}" opacity="0.12"/>`;
  let line = "";
  vals.forEach((v, i) => line += (i ? " L " : "M ") + X(i) + " " + Y(v));
  s += `<path d="${line}" fill="none" stroke="${tlColor()}" stroke-width="2" stroke-linejoin="round"/>`;
  const everyNth = Math.max(1, Math.round(n / 8));
  months.forEach((m, i) => {
    if (i % everyNth === 0) s += `<text class="axlabel" x="${X(i)}" y="${H - 7}" text-anchor="middle">${esc(m.label)}</text>`;
    s += `<circle cx="${X(i)}" cy="${Y(vals[i])}" r="7" fill="transparent"><title>${esc(m.label)}: £${Math.round(vals[i]).toLocaleString("en-GB")} cumulative</title></circle>`;
  });
  const last = vals[n - 1];
  s += `<circle cx="${X(n - 1)}" cy="${Y(last)}" r="3.5" fill="${tlColor()}" stroke="#000" stroke-width="1.5"/>`;
  s += `<text class="mk" x="${X(n - 1) - 6}" y="${Y(last) - 9}" text-anchor="end" fill="var(--t1)">£${Math.round(last).toLocaleString("en-GB")}</text>`;
  svg.innerHTML = s;
}

function renderTimeline() {
  if (!hasTimeline) return;
  tlBars("tl-bars", timeline.months, 1040, 210);
  tlCum("tl-cum", timeline.months, 1040, 210);
}

/* ================= Market context charts ================= */
function mLineChart(id, data, W, H, o) {
  const svg = document.getElementById(id);
  if (!svg || !data || !data.length) return;
  const padL = 36, padR = 16, padT = 14, padB = 22, n = data.length, min = o.min, max = o.max;
  const X = i => padL + i * (W - padL - padR) / (n - 1);
  const Y = v => padT + (max - v) / (max - min) * (H - padT - padB);
  let s = "";
  for (let i = 0; i <= 4; i++) {
    const val = min + (max - min) * i / 4, y = Y(val);
    s += `<line class="gridln" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"/>`;
    s += `<text class="axlabel" x="${padL - 6}" y="${y + 3}" text-anchor="end">${Math.round(val)}</text>`;
  }
  if (o.fill) {
    let a = `M ${X(0)} ${Y(data[0])}`; data.forEach((v, i) => a += ` L ${X(i)} ${Y(v)}`);
    a += ` L ${X(n - 1)} ${H - padB} L ${X(0)} ${H - padB} Z`;
    s += `<path d="${a}" fill="${o.color}" opacity="0.12"/>`;
  }
  let p = ""; data.forEach((v, i) => p += (i ? " L " : "M ") + X(i) + " " + Y(v));
  s += `<path d="${p}" fill="none" stroke="${o.color}" stroke-width="2" stroke-linejoin="round"/>`;
  if (o.months) o.months.forEach((mo, i) => {
    const x = padL + i * (W - padL - padR) / (o.months.length - 1);
    s += `<text class="axlabel" x="${x}" y="${H - 6}" text-anchor="middle">${esc(mo)}</text>`;
  });
  if (o.markMin) {
    let mi = 0; data.forEach((v, i) => { if (v < data[mi]) mi = i; });
    s += `<circle cx="${X(mi)}" cy="${Y(data[mi])}" r="3.5" fill="${CHART.blue}" stroke="#000" stroke-width="1.5"/>`;
    s += `<text class="mk" x="${X(mi)}" y="${Y(data[mi]) + 16}" text-anchor="middle" fill="${CHART.blue}">${data[mi].toFixed(0)}</text>`;
  }
  if (o.markLast) {
    const lv = data[n - 1];
    s += `<circle cx="${X(n - 1)}" cy="${Y(lv)}" r="3.5" fill="${o.color}" stroke="#000" stroke-width="1.5"/>`;
    s += `<text class="mk" x="${X(n - 1) - 6}" y="${Y(lv) - 9}" text-anchor="end" fill="${CHART.t1}">${lv.toFixed(2)}</text>`;
  }
  svg.innerHTML = s;
}

function renderMarket() {
  const m = TENDER.market;
  if (!m) return;
  const power = m.power || {}, gas = m.gas || {};
  const spot = power.spotNow;
  const r5 = power.rangeLong || {};
  const r5yrs = r5.years ? String(r5.years) : "";

  // KPI cards
  const cards = [];
  if (spot != null) cards.push({ t: "Power spot", k: (spot / 10).toFixed(2), lab: `p/kWh · £${spot.toFixed(2)}/MWh today`, cls: "accent-amber" });
  if (gas.spotNow != null) cards.push({ t: "Gas spot", k: gas.spotNow.toFixed(2), lab: "p/therm · NBP", cls: "accent-purple" });
  if (r5.min != null && r5.max != null) cards.push({ t: (r5yrs ? r5yrs + "-yr" : "Recent") + " power range", k: `${(r5.min / 10).toFixed(1)}–${(r5.max / 10).toFixed(1)}`, lab: `p/kWh · £${r5.min}–${r5.max}/MWh`, cls: "accent-blue" });
  if (power.series && power.series.length > 1) {
    const first = power.series[0], last = power.series[power.series.length - 1];
    const chg = (last - first) / first * 100;
    cards.push({ t: "Trend", k: `${chg >= 0 ? "+" : ""}${chg.toFixed(0)}%`, lab: "power vs start of period", cls: chg >= 0 ? "accent-amber" : "accent-green" });
  }
  const mkpis = document.getElementById("mkpis");
  if (mkpis) mkpis.innerHTML = cards.map(x =>
    `<div class="card ${x.cls}"><div class="kpi-label">${esc(x.t)}</div><div class="kpi-value">${x.k}</div><div class="kpi-sub">${esc(x.lab)}</div></div>`).join("");

  // Power line
  if (power.series && power.series.length) {
    const lo = Math.min(...power.series), hi = Math.max(...power.series);
    mLineChart("pchart", power.series, 1040, 300, {
      min: Math.floor((lo - 10) / 10) * 10, max: Math.ceil((hi + 10) / 10) * 10,
      color: CHART.amber, months: power.seriesLabels, markMin: true, markLast: true,
    });
    const pl = document.getElementById("plegend");
    if (pl) pl.innerHTML = `<span class="lg"><span class="sw" style="background:${CHART.amber}"></span>UK power (£/MWh)</span>`;
  }

  // 5-year range
  if (r5.series && r5.series.length) {
    const lo = Math.min(...r5.series), hi = Math.max(...r5.series);
    mLineChart("ychart", r5.series, 520, 200, {
      min: Math.floor((lo - 5) / 10) * 10, max: Math.ceil((hi + 5) / 10) * 10,
      color: CHART.blue, months: r5.axisLabels, markLast: true,
    });
  }

  // Gas cards + mini chart
  if (gas.contracts && gas.contracts.length) {
    const gc = document.getElementById("gcards");
    if (gc) gc.innerHTML = gas.contracts.map(g =>
      `<div class="gcard"><div class="kpi-label">${esc(g[0])}</div>
        <div class="kpi-value" style="font-size:17px;margin-top:4px">${Number(g[1]).toFixed(2)}</div>
        <div class="kpi-label" style="letter-spacing:.02em;margin-top:2px">p/therm</div></div>`).join("");
  }
  if (gas.series && gas.series.length) {
    const lo = Math.min(...gas.series), hi = Math.max(...gas.series);
    mLineChart("gchart", gas.series, 520, 120, {
      min: Math.floor((lo - 5) / 10) * 10, max: Math.ceil((hi + 5) / 10) * 10,
      color: CHART.purple, markLast: true, fill: true,
    });
  }

  // Takeaway
  const tk = document.getElementById("mtakeaway");
  if (tk && m.commentary) tk.textContent = m.commentary;
}

render();
</script>
</body>
</html>
